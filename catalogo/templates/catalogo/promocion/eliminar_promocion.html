{% extends 'base-admin.html' %}
{% load static %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-7 col-lg-6">
            <div class="card bg-dark text-white border-danger shadow-lg rounded-4">
                <div class="modal-header border-danger p-3">
                    <h5 class="modal-title text-danger fw-bold mb-0">
                        <i class="bi bi-exclamation-triangle-fill me-2"></i>Eliminar Promoción
                    </h5>
                    <a href="{% url 'listado-promocion' %}" class="btn-close btn-close-white" aria-label="Cerrar"></a>
                </div>
                <div class="card-body text-center py-4 px-4">
                    <i class="bi bi-x-circle-fill text-danger reservas-ver-agenda__i-21 d-block mb-3" style="font-size: 3rem;"></i>
                    <p class="mt-3 fs-5">¿Seguro que deseas eliminar la promoción <strong class="text-white">"{{ promocion.nombre }}"</strong>?</p>
                    <p class="text-secondary small mb-3">Esta acción no se puede deshacer.</p>
                </div>
                <div class="modal-footer border-danger justify-content-center gap-3 p-3">
                    <a href="{% url 'listado-promocion' %}" class="btn btn-secondary px-4">
                        <i class="bi bi-arrow-left me-1"></i>Volver
                    </a>
                    <form method="POST" class="d-inline m-0">
                        {% csrf_token %}
                        <button type="submit" class="btn btn-danger px-4">
                            <i class="bi bi-x-circle-fill me-1"></i>Sí, eliminar
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
