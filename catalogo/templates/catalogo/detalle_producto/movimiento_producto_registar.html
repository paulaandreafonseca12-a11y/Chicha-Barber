{% extends 'base-admin.html' %}
{% load static %}

{% block content %}
<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-lg-9">
            <div class="card border border-secondary border-opacity-25 rounded-4 shadow-lg overflow-hidden">

                <div class="card-header border-bottom border-secondary border-opacity-25 p-4 d-flex justify-content-between align-items-center">
                    <h5 class="mb-0 fw-bold d-flex align-items-center gap-2">
                        <i class="bi bi-arrow-left-right text-warning fs-5"></i>
                        Registrar Movimiento de Existencias
                    </h5>

                    <a href="{% url 'lista_movimientos_existencias' %}"
                       class="btn btn-sm btn-outline-light fw-bold rounded-pill px-3 py-2 d-flex align-items-center gap-1">
                        <i class="bi bi-arrow-left"></i>
                        Volver
                    </a>
                </div>

                <div class="card-body p-4 p-md-5">
                    <form method="POST">
                        {% csrf_token %}

                        <div class="row g-4">

                            <!-- PRODUCTO -->
                            <div class="col-md-6">
                                <label for="producto_id" class="form-label fw-semibold">
                                    Producto
                                </label>
                                <select name="producto_id" id="producto_id" class="form-select" required>
                                    <option value="">Seleccione un producto</option>
                                    {% for producto in productos %}
                                        <option value="{{ producto.codigo_producto }}">
                                            {{ producto.nombre }} - #{{ producto.codigo_producto }}
                                        </option>
                                    {% endfor %}
                                </select>
                            </div>

                            <!-- TIPO -->
                            <div class="col-md-6">
                                <label for="tipo" class="form-label fw-semibold">
                                    Tipo de movimiento
                                </label>
                                <select name="tipo" id="tipo" class="form-select" required>
                                    <option value="">Seleccione el tipo</option>
                                    <option value="entrada">Entrada</option>
                                    <option value="salida">Salida</option>
                                </select>
                            </div>

                            <!-- CANTIDAD -->
                            <div class="col-md-6">
                                <label for="cantidad" class="form-label fw-semibold">
                                    Cantidad
                                </label>
                                <input type="number" name="cantidad" id="cantidad" class="form-control" min="1" required>
                            </div>

                            <!-- MOTIVO -->
                            <div class="col-md-6">
                                <label for="motivo" class="form-label fw-semibold">
                                    Motivo
                                </label>
                                <input type="text" name="motivo" id="motivo" class="form-control" placeholder="Ej: Compra, venta, ajuste...">
                            </div>

                            <!-- BOTONES -->
                            <div class="col-12">
                                <div class="d-flex justify-content-end gap-3 mt-4 pt-4 border-top border-secondary border-opacity-25">
                                    <a href="{% url 'lista_movimientos_existencias' %}"
                                       class="btn btn-outline-secondary px-4 fw-semibold rounded-pill">
                                        <i class="bi bi-x-circle me-1"></i>
                                        Cancelar
                                    </a>

                                    <button type="submit"
                                            class="btn btn-warning text-dark fw-bold px-4 rounded-pill shadow-sm d-flex align-items-center gap-2">
                                        <i class="bi bi-save-fill"></i>
                                        Registrar Movimiento
                                    </button>
                                </div>
                            </div>

                        </div>
                    </form>
                </div>

            </div>
        </div>
    </div>
</div>
{% endblock %}
