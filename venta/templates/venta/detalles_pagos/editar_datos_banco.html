{% extends "base-admin.html" %}
{% load static %}

{% block content %}
<div class="container-fluid px-4 py-4 configuracion-admin">
  <div class="row justify-content-center">
    <div class="col-md-8">
      <div class="card border border-secondary border-opacity-25 rounded-4 shadow-lg overflow-hidden">
        <div class="card-header py-3 px-4">
          <h5 class="mb-0 fw-bold">
            <i class="bi bi-bank me-2 text-warning"></i>Configurar datos de transferencia
          </h5>
        </div>

        <div class="card-body p-4">
          <p class="text-white-50 mb-4">
            <i class="bi bi-info-circle me-1 text-warning"></i>
            Esta información se mostrará a los clientes cuando paguen mediante transferencia bancaria.
          </p>

          <form method="POST">
            {% csrf_token %}

            <div class="row g-3">
              <div class="col-md-6 mb-3">
                <label for="banco" class="form-label fw-bold">Nombre del Banco</label>
                <input
                  type="text"
                  class="form-control"
                  id="banco"
                  name="banco"
                  value="{{ datos.banco }}"
                  required
                  placeholder="Ej: Nequi, Bancolombia, etc."
                />
              </div>
              <div class="col-md-6 mb-3">
                <label for="tipo_cuenta" class="form-label fw-bold">Tipo de Cuenta</label>
                <input
                  type="text"
                  class="form-control"
                  id="tipo_cuenta"
                  name="tipo_cuenta"
                  value="{{ datos.tipo_cuenta }}"
                  required
                  placeholder="Ej: Ahorros, Corriente, Celular"
                />
              </div>
            </div>

            <div class="row g-3">
              <div class="col-md-6 mb-3">
                <label for="numero_cuenta" class="form-label fw-bold">Número de Cuenta</label>
                <input
                  type="text"
                  class="form-control"
                  id="numero_cuenta"
                  name="numero_cuenta"
                  value="{{ datos.numero_cuenta }}"
                  required
                  placeholder="Ej: 123-456789-00"
                />
              </div>
              <div class="col-md-6 mb-3">
                <label for="titular" class="form-label fw-bold">Nombre del Titular</label>
                <input
                  type="text"
                  class="form-control"
                  id="titular"
                  name="titular"
                  value="{{ datos.titular }}"
                  required
                  placeholder="Nombre completo o Razón Social"
                />
              </div>
            </div>

            <div class="mb-4">
              <label for="instrucciones" class="form-label fw-bold">Instrucciones o Notas</label>
              <textarea
                class="form-control"
                id="instrucciones"
                name="instrucciones"
                rows="3"
                required
                placeholder="Ej: Envía el comprobante por WhatsApp"
              >{{ datos.instrucciones }}</textarea>
              <div class="form-text small">
                Aparecerá resaltado como una nota para el cliente.
              </div>
            </div>

            <div class="d-flex justify-content-end gap-2 mt-4">
              <a
                href="{% url 'ver_datos_banco' %}"
                class="btn btn-outline-secondary rounded-pill px-4"
                >Cancelar</a
              >
              <button
                type="submit"
                class="btn btn-warning text-dark fw-bold rounded-pill px-4 btn-panel-gold"
              >
                <i class="bi bi-save me-2"></i>Guardar Cambios
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
