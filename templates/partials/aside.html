{% load static %}
<aside class="admin-aside d-flex flex-column flex-shrink-0 p-3 bg-black text-white shadow-lg partials-aside__aside-1 border-end border-gold-subtle">

  <!-- BOTÓN CERRAR (SOLO MÓVIL) -->
  <div class="d-lg-none text-end mb-2">
    <button type="button" class="btn btn-sm text-warning" onclick="closeAside()" aria-label="Cerrar menú">
      <i class="bi bi-x-lg"></i>
    </button>
  </div>

  <!-- LOGO Y NOMBRE -->
  <div class="d-flex align-items-center mb-3 mb-md-0 me-md-auto text-white text-decoration-none">
  <img src="{% static 'img/logo.png' %}"
       alt="Chicha Barber"
       height="50"
       class="me-2 flex-shrink-0"
       style="filter: drop-shadow(0px 0px 8px rgba(255, 193, 7, 0.6));">
  <span class="fs-4 fw-bold text-uppercase  tracking-wide text-nowrap">Chicha Barber</span>
</div>

  <hr class="border-secondary opacity-25 my-3" />

  <!-- DASHBOARD -->
  <div class="mb-3">
    <a href="{% url 'inicio_admin' %}" class="d-flex align-items-center px-3 py-2.5 rounded-3 text-decoration-none {% if request.resolver_match.url_name == 'inicio_admin' %}bg-warning bg-opacity-10 text-warning fw-bold border border-warning border-opacity-25{% else %}text-white-50 bg-dark bg-opacity-50{% endif %} partials-aside__a-2">
      <i class="bi bi-speedometer2 me-2 fs-5 {% if request.resolver_match.url_name == 'inicio_admin' %}text-warning{% else %}text-white-50{% endif %}"></i>
      <span>Dashboard</span>
    </a>
  </div>

  <div class="accordion accordion-flush bg-transparent" id="sidebarAccordion">

    <!-- GESTIÓN DE SERVICIOS -->
    <div class="accordion-item bg-transparent border-0">
      <h2 class="accordion-header">
        <button class="accordion-button {% if 'servicios' in request.path and 'promocion' not in request.path and 'calificacion' not in request.path %}{% else %}collapsed{% endif %} bg-transparent {% if 'servicios' in request.path and 'promocion' not in request.path and 'calificacion' not in request.path %}text-warning fw-bold{% else %}text-white{% endif %} shadow-none border-0 partials-aside__button-3" type="button" data-bs-toggle="collapse" data-bs-target="#collapseServicios">
          <i class="bi bi-gear-wide-connected me-2 text-warning"></i> Gestión de Servicios
        </button>
      </h2>
      <div id="collapseServicios" class="accordion-collapse collapse {% if 'servicios' in request.path and 'promocion' not in request.path and 'calificacion' not in request.path %}show{% endif %}" data-bs-parent="#sidebarAccordion">
        <div class="accordion-body p-0">
          <div class="list-group list-group-flush">
            <a href="{% url 'listado-admin' %}" class="list-group-item list-group-item-action bg-transparent {% if request.resolver_match.url_name == 'listado-admin' %}text-warning fw-bold{% else %}text-white-50{% endif %} border-0 ps-4">
              <i class="bi bi-list-ul me-2"></i> Lista de servicios
            </a>
          </div>
        </div>
      </div>
    </div>

    <!-- OFERTAS Y PROMOS -->
    <div class="accordion-item bg-transparent border-0">
      <h2 class="accordion-header">
        <button class="accordion-button {% if 'promocion' in request.path %}{% else %}collapsed{% endif %} bg-transparent {% if 'promocion' in request.path %}text-warning fw-bold{% else %}text-white{% endif %} shadow-none border-0 partials-aside__button-5" type="button" data-bs-toggle="collapse" data-bs-target="#collapsePromos">
          <i class="bi bi-megaphone me-2 text-warning"></i> Ofertas y Promos
        </button>
      </h2>
      <div id="collapsePromos" class="accordion-collapse collapse {% if 'promocion' in request.path %}show{% endif %}" data-bs-parent="#sidebarAccordion">
        <div class="accordion-body p-0">
          <div class="list-group list-group-flush">
            <a href="{% url 'listado-promocion' %}" class="list-group-item list-group-item-action bg-transparent {% if request.resolver_match.url_name == 'listado-promocion' %}text-warning fw-bold{% else %}text-white-50{% endif %} border-0 ps-4">
              <i class="bi bi-list-ul me-2"></i> Lista de promociones
            </a>
          </div>
        </div>
      </div>
    </div>

    <!-- CALIFICACIONES -->
    <div class="accordion-item bg-transparent border-0">
      <h2 class="accordion-header">
        <button class="accordion-button {% if 'calificacion' in request.path %}{% else %}collapsed{% endif %} bg-transparent {% if 'calificacion' in request.path %}text-warning fw-bold{% else %}text-white{% endif %} shadow-none border-0 partials-aside__button-7" type="button" data-bs-toggle="collapse" data-bs-target="#collapseCalificaciones">
          <i class="bi bi-star me-2 text-warning"></i> Calificaciones
        </button>
      </h2>
      <div id="collapseCalificaciones" class="accordion-collapse collapse {% if 'calificacion' in request.path %}show{% endif %}" data-bs-parent="#sidebarAccordion">
        <div class="accordion-body p-0">
          <div class="list-group list-group-flush">
            <a href="{% url 'listado-calificacion' %}" class="list-group-item list-group-item-action bg-transparent {% if request.resolver_match.url_name == 'listado-calificacion' or request.resolver_match.url_name == 'listado_calificaciones_admin' %}text-warning fw-bold{% else %}text-white-50{% endif %} border-0 ps-4">
              <i class="bi bi-list-ul me-2"></i> Lista de calificaciones
            </a>
          </div>
        </div>
      </div>
    </div>

    <!-- RESERVAS -->
    <div class="accordion-item bg-transparent border-0">
      <h2 class="accordion-header">
        <button class="accordion-button {% if 'reservas' in request.path or 'agenda' in request.path %}{% else %}collapsed{% endif %} bg-transparent {% if 'reservas' in request.path or 'agenda' in request.path %}text-warning fw-bold{% else %}text-white{% endif %} shadow-none border-0 partials-aside__button-9" type="button" data-bs-toggle="collapse" data-bs-target="#collapseReservas">
          <i class="bi bi-calendar-event me-2 text-warning"></i> Reservas
        </button>
      </h2>
      <div id="collapseReservas" class="accordion-collapse collapse {% if 'reservas' in request.path or 'agenda' in request.path %}show{% endif %}" data-bs-parent="#sidebarAccordion">
        <div class="accordion-body p-0">
          <div class="list-group list-group-flush">
            <a href="{% url 'ver_agenda' %}" class="list-group-item list-group-item-action bg-transparent {% if request.resolver_match.url_name == 'ver_agenda' or request.resolver_match.url_name == 'crear_reserva_admin' %}text-warning fw-bold{% else %}text-white-50{% endif %} border-0 ps-4">
              <i class="bi bi-calendar-check me-2"></i> Ver Agenda
            </a>
          </div>
        </div>
      </div>
    </div>

    <!-- MENÚ 1: CATÁLOGO DE PRODUCTOS -->
    <div class="accordion-item bg-transparent border-0">
      <h2 class="accordion-header">
        <button class="accordion-button {% if request.resolver_match.url_name in 'lista_productos_admin,crear_producto,editar_producto,eliminar_producto,lista_categorias,crear_categoria,editar_categoria,eliminar_categoria,lista_marcas,crear_marca,editar_marca,eliminar_marca' %}{% else %}collapsed{% endif %} bg-transparent {% if request.resolver_match.url_name in 'lista_productos_admin,crear_producto,editar_producto,eliminar_producto,lista_categorias,crear_categoria,editar_categoria,eliminar_categoria,lista_marcas,crear_marca,editar_marca,eliminar_marca' %}text-warning fw-bold{% else %}text-white{% endif %} shadow-none border-0"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#collapseCatalogo">
          <i class="bi bi-box-seam me-2 text-warning"></i> Catálogo de Productos
        </button>
      </h2>
      <div id="collapseCatalogo"
           class="accordion-collapse collapse {% if request.resolver_match.url_name in 'lista_productos_admin,crear_producto,editar_producto,eliminar_producto,lista_categorias,crear_categoria,editar_categoria,eliminar_categoria,lista_marcas,crear_marca,editar_marca,eliminar_marca' %}show{% endif %}"
           data-bs-parent="#sidebarAccordion">
        <div class="accordion-body p-0">
          <div class="list-group list-group-flush">
            <a href="{% url 'lista_productos_admin' %}"
               class="list-group-item list-group-item-action bg-transparent border-0 ps-4 {% if request.resolver_match.url_name in 'lista_productos_admin,crear_producto,editar_producto,eliminar_producto' %}text-warning fw-bold{% else %}text-white-50{% endif %}">
              <i class="bi bi-list-ul me-2"></i> Lista de Productos
            </a>
            <a href="{% url 'lista_categorias' %}"
               class="list-group-item list-group-item-action bg-transparent border-0 ps-4 {% if request.resolver_match.url_name in 'lista_categorias,crear_categoria,editar_categoria,eliminar_categoria' %}text-warning fw-bold{% else %}text-white-50{% endif %}">
              <i class="bi bi-grid me-2"></i> Categorías
            </a>
            <a href="{% url 'lista_marcas' %}"
               class="list-group-item list-group-item-action bg-transparent border-0 ps-4 {% if request.resolver_match.url_name in 'lista_marcas,crear_marca,editar_marca,eliminar_marca' %}text-warning fw-bold{% else %}text-white-50{% endif %}">
              <i class="bi bi-tags me-2"></i> Marcas
            </a>
          </div>
        </div>
      </div>
    </div>

    <!-- MENÚ 2: INVENTARIO Y STOCK -->
    <div class="accordion-item bg-transparent border-0">
      <h2 class="accordion-header">
        <button class="accordion-button {% if request.resolver_match.url_name in 'lista_existencias,editar_existencias,lista_movimientos_existencias,registrar_movimiento_existencias,eliminar_movimiento_existencias,lista_bitacora,editar_bitacora' %}{% else %}collapsed{% endif %} bg-transparent {% if request.resolver_match.url_name in 'lista_existencias,editar_existencias,lista_movimientos_existencias,registrar_movimiento_existencias,eliminar_movimiento_existencias,lista_bitacora,editar_bitacora' %}text-warning fw-bold{% else %}text-white{% endif %} shadow-none border-0"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#collapseInventario">
          <i class="bi bi-boxes me-2 text-warning"></i> Inventario de Productos
        </button>
      </h2>
      <div id="collapseInventario"
           class="accordion-collapse collapse {% if request.resolver_match.url_name in 'lista_existencias,editar_existencias,lista_movimientos_existencias,registrar_movimiento_existencias,eliminar_movimiento_existencias,lista_bitacora,editar_bitacora' %}show{% endif %}"
           data-bs-parent="#sidebarAccordion">
        <div class="accordion-body p-0">
          <div class="list-group list-group-flush">
            <a href="{% url 'lista_existencias' %}"
               class="list-group-item list-group-item-action bg-transparent border-0 ps-4 {% if request.resolver_match.url_name in 'lista_existencias,editar_existencias' %}text-warning fw-bold{% else %}text-white-50{% endif %}">
              <i class="bi bi-journal-text me-2"></i> Detalle Producto
            </a>
            <a href="{% url 'lista_movimientos_existencias' %}"
               class="list-group-item list-group-item-action bg-transparent border-0 ps-4 {% if request.resolver_match.url_name in 'lista_movimientos_existencias,registrar_movimiento_existencias,eliminar_movimiento_existencias' %}text-warning fw-bold{% else %}text-white-50{% endif %}">
              <i class="bi bi-arrow-left-right me-2"></i> Movimiento de productos
            </a>
            <a href="{% url 'lista_bitacora' %}"
               class="list-group-item list-group-item-action bg-transparent border-0 ps-4 {% if request.resolver_match.url_name in 'lista_bitacora,editar_bitacora' %}text-warning fw-bold{% else %}text-white-50{% endif %}">
              <i class="bi bi-clipboard-data me-2"></i> Bitácora
            </a>
          </div>
        </div>
      </div>
    </div>

    <!-- MENÚ 3: COMPRAS Y VENTAS -->
    <div class="accordion-item bg-transparent border-0">
      <h2 class="accordion-header">
        <button class="accordion-button {% if request.resolver_match.url_name in 'lista_proveedores,crear_proveedor,editar_proveedor,eliminar_proveedor,lista_compras,registrar_compra,detalle_compra,editar_compra,eliminar_compra,historial_ventas,detalle_venta,registrar_venta' %}{% else %}collapsed{% endif %} bg-transparent {% if request.resolver_match.url_name in 'lista_proveedores,crear_proveedor,editar_proveedor,eliminar_proveedor,lista_compras,registrar_compra,detalle_compra,editar_compra,eliminar_compra,historial_ventas,detalle_venta,registrar_venta' %}text-warning fw-bold{% else %}text-white{% endif %} shadow-none border-0"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#collapseComprasVentas">
          <i class="bi bi-cart-check me-2 text-warning"></i> Compras & Ventas
        </button>
      </h2>
      <div id="collapseComprasVentas"
           class="accordion-collapse collapse {% if request.resolver_match.url_name in 'lista_proveedores,crear_proveedor,editar_proveedor,eliminar_proveedor,lista_compras,registrar_compra,detalle_compra,editar_compra,eliminar_compra,historial_ventas,detalle_venta,registrar_venta' %}show{% endif %}"
           data-bs-parent="#sidebarAccordion">
        <div class="accordion-body p-0">
          <div class="list-group list-group-flush">
            <a href="{% url 'lista_proveedores' %}"
               class="list-group-item list-group-item-action bg-transparent border-0 ps-4 {% if request.resolver_match.url_name in 'lista_proveedores,crear_proveedor,editar_proveedor,eliminar_proveedor' %}text-warning fw-bold{% else %}text-white-50{% endif %}">
              <i class="bi bi-truck me-2"></i> Proveedores
            </a>
            <a href="{% url 'lista_compras' %}"
               class="list-group-item list-group-item-action bg-transparent border-0 ps-4 {% if request.resolver_match.url_name in 'lista_compras,registrar_compra,detalle_compra,editar_compra,eliminar_compra' %}text-warning fw-bold{% else %}text-white-50{% endif %}">
              <i class="bi bi-box-arrow-in-down me-2"></i> Compras
            </a>
            <a href="{% url 'historial_ventas' %}"
               class="list-group-item list-group-item-action bg-transparent border-0 ps-4 {% if request.resolver_match.url_name in 'historial_ventas,detalle_venta,registrar_venta' %}text-warning fw-bold{% else %}text-white-50{% endif %}">
              <i class="bi bi-receipt me-2"></i> Ventas
            </a>
          </div>
        </div>
      </div>
    </div>

    <!-- USUARIOS -->
    <div class="accordion-item bg-transparent border-0">
      <h2 class="accordion-header">
        <button class="accordion-button {% if 'usuarios' in request.path %}{% else %}collapsed{% endif %} bg-transparent {% if 'usuarios' in request.path %}text-warning fw-bold{% else %}text-white{% endif %} shadow-none border-0 partials-aside__button-15" type="button" data-bs-toggle="collapse" data-bs-target="#collapseUsuarios">
          <i class="bi bi-people me-2 text-warning"></i> Usuarios
        </button>
      </h2>
      <div id="collapseUsuarios" class="accordion-collapse collapse {% if 'usuarios' in request.path %}show{% endif %}" data-bs-parent="#sidebarAccordion">
        <div class="accordion-body p-0">
          <div class="list-group list-group-flush">
            <a href="{% url 'lista_usuarios' %}" class="list-group-item list-group-item-action bg-transparent {% if request.resolver_match.url_name in 'lista_usuarios,crear_usuario,editar_usuario' %}text-warning fw-bold{% else %}text-white-50{% endif %} border-0 ps-4">
              <i class="bi bi-person me-2"></i> Lista de usuarios
            </a>
          </div>
        </div>
      </div>
    </div>

    <!-- CONFIGURACIÓN -->
    <div class="accordion-item bg-transparent border-0">
      <h2 class="accordion-header">
        <button class="accordion-button {% if 'configuraciones' in request.path or 'carrusel' in request.path or 'datos-banco' in request.path or 'testimonios' in request.path %}{% else %}collapsed{% endif %} bg-transparent {% if 'configuraciones' in request.path or 'carrusel' in request.path or 'datos-banco' in request.path or 'testimonios' in request.path %}text-warning fw-bold{% else %}text-white{% endif %} shadow-none border-0 partials-aside__button-17" type="button" data-bs-toggle="collapse" data-bs-target="#collapseConfiguracion">
          <i class="bi bi-gear me-2 text-warning"></i> Configuración
        </button>
      </h2>
      <div id="collapseConfiguracion" class="accordion-collapse collapse {% if 'configuraciones' in request.path or 'carrusel' in request.path or 'datos-banco' in request.path or 'testimonios' in request.path %}show{% endif %}" data-bs-parent="#sidebarAccordion">
        <div class="accordion-body p-0">
          <div class="list-group list-group-flush">
            <a href="{% url 'carrusel' %}" class="list-group-item list-group-item-action bg-transparent {% if request.resolver_match.url_name == 'carrusel' %}text-warning fw-bold{% else %}text-white-50{% endif %} border-0 ps-4">
              <i class="bi bi-images me-2"></i> Carrusel
            </a>
            <a href="{% url 'ver_datos_banco' %}" class="list-group-item list-group-item-action bg-transparent {% if request.resolver_match.url_name in 'ver_datos_banco,editar_datos_banco' %}text-warning fw-bold{% else %}text-white-50{% endif %} border-0 ps-4">
              <i class="bi bi-bank me-2"></i> Datos Banco
            </a>
            <a href="{% url 'testimonios_admin' %}" class="list-group-item list-group-item-action bg-transparent {% if request.resolver_match.url_name == 'testimonios_admin' %}text-warning fw-bold{% else %}text-white-50{% endif %} border-0 ps-4">
              <i class="bi bi-chat-quote me-2"></i> Testimonios
            </a>
          </div>
        </div>
      </div>
    </div>

  </div>
</aside>
